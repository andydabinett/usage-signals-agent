[project]
name = "usage-signals-agent"
version = "0.1.0"
description = "Real public signals + warehouse-first scoring + cited sales handoffs (Figma demo)"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "selectolax>=0.3.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.10"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "sqlglot>=25"]

[project.scripts]
signals = "signals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
